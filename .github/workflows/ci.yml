# Quality gate for industrial-aiops (uv-managed; uv.lock is committed).
#
# Three lanes:
#   * gate                  — the release quality gate (pytest + ruff + bandit) on
#                             Python 3.11 and 3.12, with only the cross-platform
#                             connector libs (the `all` extra) installed. That set is
#                             exactly what the non-integration suite imports for real
#                             (asyncua / pymodbus / paho-mqtt / …); the energy / TSDB /
#                             HART contract tests importorskip, so they self-skip here.
#   * integration-contracts — installs the pure-python energy/TSDB/HART extras that
#                             publish linux wheels and runs the `integration`-marked
#                             library-API contract tests so the importorskip-gated
#                             bindings actually execute on linux (see job comment).
#   * margo-descriptor      — validates deploy/margo/margo.yaml against the vendored
#                             margo.org/v1-alpha1 LinkML schema (structural validity
#                             only; NOT a compliance claim).
#
# Action pins are floating major tags verified to exist:
#   actions/checkout@v4, astral-sh/setup-uv@v6.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; this workflow never writes to the repo.
permissions:
  contents: read

# One in-flight run per ref — a new push cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Release quality gate ────────────────────────────────────────────────────
  # `uv sync` installs the locked base deps + the `dev` group (pytest, ruff);
  # `--extra all` adds the cross-platform connector libs the base suite needs.
  gate:
    name: gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # `iotdb` and `export` are pure wheels and cost seconds, but leaving them out
      # meant two tests skipped on every build: the IoTDB binding contract (the
      # historian sink's `Session` surface) and the Parquet export path. Both are
      # code this repo ships; a skip there is coverage we claimed and did not have.
      # `tdengine` stays out — its taospy needs a vendor C client, which the
      # integration-contracts job installs deliberately rather than every gate run.
      - name: Sync env (base + dev tools + cross-platform connectors)
        run: uv sync --extra all --extra iotdb --extra export

      # socat is what lets tests/test_modbus_rtu_live.py stand up a PTY pair and
      # drive a REAL pymodbus RTU server over it — the only test that exercises the
      # connector's serial framing path end to end. Without it those five tests
      # skip, which is what they had been doing on every run: the -rs change one
      # commit earlier is what made that visible. Two seconds of apt buys a
      # continuously-verified wire path instead of one that gets checked by hand
      # every few weeks (see #115, where four weeks of not running let an upstream
      # fix turn a workaround into a silent failure).
      - name: Install socat (real-serial test scaffolding)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq socat

      # --no-sync: reuse the env synced above. A bare `uv run` re-syncs to the
      # default (no extras), which would UNINSTALL the `all` connector libs that
      # the base suite imports directly (asyncua / pymodbus / paho-mqtt …).
      # test_uns_live_integration.py is the only test that drives the UNS bridge
      # through the FULL paho loop against a real broker — every other MQTT test
      # injects messages into the on_message callback, so nothing else proves the
      # live path works on paho 2.x. It had been skipping on every run for want of
      # a broker (surfaced by the -rs change in #117).
      #
      # mosquitto 2.x listens on localhost only and denies anonymous clients by
      # default, so the config is supplied explicitly rather than relying on the
      # image's defaults.
      - name: Start MQTT broker (UNS live bridge scaffolding)
        if: runner.os == 'Linux'
        run: |
          printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
          docker run -d --rm --name iaiops-mosquitto -p 1883:1883 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf eclipse-mosquitto:2
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "broker accepting connections (attempt $i)"; exit 0
            fi
            sleep 1
          done
          echo "::error title=MQTT broker::mosquitto did not accept connections within 20s"
          docker logs iaiops-mosquitto || true
          exit 1

      # The NATS egress tests are the only ones that put plant data on a real bus
      # and read it back off — and they had been skipping on every CI run for want
      # of a broker, which is exactly the "verified only when convenient" state the
      # MQTT step above was added to end. `docs/VERIFICATION-RECORD.md` called NATS
      # rung 2a on the strength of local runs; this makes that true continuously.
      - name: Start NATS broker (egress live scaffolding)
        if: runner.os == 'Linux'
        run: |
          docker run -d --rm --name iaiops-nats -p 4222:4222 nats:2.11-alpine
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              echo "broker accepting connections (attempt $i)"; exit 0
            fi
            sleep 1
          done
          echo "::error title=NATS broker::nats did not accept connections within 20s"
          docker logs iaiops-nats || true
          exit 1

      # BACnet/IP discovery is a UDP broadcast and loopback does not carry it, so
      # the virtual device and the connector need two addresses on one subnet. The
      # harness adds the second one; see scripts/bacnet_live_harness.sh.
      #
      # This ran as a continue-on-error experiment first: reproducing the recipe on
      # Docker Desktop / arm64 had discovered no device, and it was not worth
      # concluding anything about the product from a suspect substrate. ubuntu-latest
      # passed it on both Python versions, so it became blocking — a path verified
      # only when convenient is the situation those rounds were about.
      #
      # CORRECTION (2026-08-02): "the macOS VM's bridge" was the wrong conclusion.
      # The same harness passes on that machine inside a PRIVILEGED Linux container,
      # where it adds the second address to the container's own eth0:
      #   docker run --rm --privileged -v "$PWD:/src:ro" -w /src <image> \
      #     bash scripts/bacnet_live_harness.sh python -m pytest tests/test_bacnet_live.py
      # What failed before was running it against the host's network, not the
      # substrate being incapable. Recorded because the wrong version of this had
      # already discouraged one retry.
      - name: BACnet two-IP harness (real broadcast round-trip)
        if: runner.os == 'Linux'
        run: |
          sudo -E env "PATH=$PATH" IAIOPS_REQUIRE_LIVE=1 scripts/bacnet_live_harness.sh \
            uv run --no-sync pytest tests/test_bacnet_live.py -q -rs

      # PROFINET was the last mock-only protocol here that was not hardware-gated.
      # DCP is layer-2 request-response, so the missing half is a RESPONDER, not a
      # device: a veth pair gives pnio-dcp a real wire and tests/profinet_dcp_station.py
      # answers on the other end. Needs CAP_NET_ADMIN (create the pair) and
      # CAP_NET_RAW (the sockets), which is why it runs under sudo like the BACnet
      # harness rather than in the ordinary pytest step.
      - name: PROFINET-DCP veth harness (real layer-2 round-trip)
        if: runner.os == 'Linux'
        run: |
          # IAIOPS_REQUIRE_LIVE=1: this step exists only to run this file, so a
          # SKIP here is a regression, not an environment. Without it `pytest -q`
          # prints "6 skipped" and exits 0 — see tests/conftest.py.
          sudo -E env "PATH=$PATH" IAIOPS_REQUIRE_LIVE=1 scripts/profinet_dcp_harness.sh \
            uv run --no-sync pytest tests/test_profinet_live.py -q -rs

      # A SECOND MCP implementation. Every other MCP test here runs the Python
      # SDK's client against a server built on that same SDK, which cannot rule
      # out a misreading inside it (VERIFICATION-RECORD note 9). The TypeScript
      # SDK is another language and another codebase; it is also what found the
      # handshake reporting the SDK's version as the server's.
      - name: Install the TypeScript MCP client (second implementation)
        if: runner.os == 'Linux'
        run: npm install --prefix tests/mcp_ts_client --no-audit --no-fund

      - name: pytest (base suite)
        # -rs prints the reason for every skip. Without it the log says "10 skipped"
        # and nothing else, so a test that quietly stops running — a missing optional
        # dependency, a platform guard, a gate that silently changed — is invisible
        # for as long as the total stays plausible. That is how the DNP3 live test
        # went unexercised for four weeks (iaiops-energy#23).
        run: uv run --no-sync pytest -q -rs

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format (check)
        run: uv run --no-sync ruff format --check .

      # --severity-level medium: bandit exits non-zero on any finding at/above the
      # threshold. The project's gate is "0 Medium+" (the ~40 Low B110 try/except
      # are accepted), so without this it would fail on those Low findings.
      - name: bandit (static security scan, 0 Medium+)
        run: uvx bandit -q -r iaiops mcp_server --severity-level medium

  # ── Margo descriptor schema gate ────────────────────────────────────────────
  # deploy/margo/margo.yaml is a machine-readable artifact consumed by an
  # orchestrator we do not control, and until now nothing checked it: a typo'd
  # field name or a dropped enum value would ship and surface as a deployment
  # failure at a customer site. The Margo compliance test suite does not exist
  # yet (no conformance repo in the `margo` org), but the specification DOES
  # publish a LinkML schema for the Application Description — so structural
  # validity is checkable today, and this job checks it.
  #
  # Schema + upstream control examples are VENDORED (deploy/margo/schema/, pinned
  # to an upstream commit): `pre-draft` is a moving branch, and a live fetch would
  # turn an upstream edit into a red build on an unrelated PR. Drift is reported
  # separately and advisory-only. See deploy/margo/schema/PROVENANCE.md.
  margo-descriptor:
    name: margo descriptor (schema-valid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Validates the upstream valid AND invalid controls before our descriptor,
      # so a validator that stopped discriminating fails here instead of passing
      # us vacuously.
      - name: Validate against vendored margo.org/v1-alpha1 schema
        run: ./scripts/margo_validate.sh

      # Advisory: tells us the spec moved, never fails somebody's PR. Re-vendor
      # deliberately (copy the files, bump the commit in PROVENANCE.md, re-run).
      - name: Upstream schema drift (advisory)
        continue-on-error: true
        run: |
          upstream=$(mktemp)
          curl -fsSL -o "$upstream" \
            https://raw.githubusercontent.com/margo/specification/pre-draft/src/specification/applications/application-description.linkml.yaml
          if diff -q "$upstream" deploy/margo/schema/application-description.linkml.yaml >/dev/null; then
            echo "vendored schema matches upstream pre-draft"
          else
            echo "::warning::Margo's upstream schema has moved since it was vendored."
            echo "Re-vendor deploy/margo/schema/ and update PROVENANCE.md. Diff:"
            diff "$upstream" deploy/margo/schema/application-description.linkml.yaml || true
          fi

  # ── Immutable-host readiness (Margo device role) ────────────────────────────
  # Margo's device role is a hardened, centrally-managed host. Validating on a
  # specific one (IGEL OS) needs that vendor; what an immutable host DEMANDS OF AN
  # APPLICATION does not — non-root, a read-only root filesystem, and all mutable
  # state inside the declared volume — and that is checkable on any runner.
  #
  # It is a job rather than a note because the published images FAILED it: `VOLUME`
  # after `USER` left the state directory root-owned, so the app could not write its
  # own audit chain (reads unaudited, every high-risk write denied fail-closed).
  # A Dockerfile regression is invisible to every other job here.
  immutable-host:
    name: immutable-host readiness (container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Built from the branch's Dockerfile; the wheel it installs is the last
      # published one, which is what the image does in production anyway. The
      # property under test belongs to the image, not the wheel.
      - name: Build the edge image
        run: docker build -f deploy/margo/Dockerfile --build-arg PROFILE=modbus -t iaiops-immutable:ci deploy/margo

      - name: Non-root, read-only rootfs, writable state, audit chain accepts a row
        run: scripts/immutable_host_check.sh iaiops-immutable:ci

  # ── Integration contract tests (linux only) ─────────────────────────────────
  # The base suite mocks every protocol library, so the preview/待核实 bindings can
  # drift from the real library API and still pass. These `integration`-marked
  # contract tests assert the real symbols/methods exist — but only when the actual
  # optional library is importable. This lane installs the ones that publish linux
  # wheels so those assertions run for real in CI.
  #
  # Installed: `all` (asyncua/BAC0/…) + iec104 (c104) + iotdb (apache-iotdb) +
  # tdengine (taospy) + hart (hart-protocol) + pyiec61850 (1.5-series alpha,
  # linux-only manylinux wheel → needs --prerelease=allow).
  #
  # Deliberately NOT installed / skipped, and why:
  #   * pydnp3 (dnp3/energy) — builds a native C++ ext (no wheel); would break the
  #     lane on every run. Its contract test importorskips, so it self-skips.
  #   * ethercat (pysoem) / profinet (pnio-dcp) — need layer-2 raw sockets +
  #     root/CAP_NET_RAW + real NIC/slaves; not runnable on a hosted runner.
  #   * live serial (Modbus-RTU) — needs real RS-485/USB hardware.
  #   * taospy's symbol test additionally needs the native libtaos client at
  #     runtime; absent here it skips (the binding test handles that path).
  integration-contracts:
    name: integration contracts (linux, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install all + pure-python energy/TSDB/HART extras (linux wheels)
        run: |
          uv venv --python 3.12
          uv pip install -e '.[all,iec104,iotdb,tdengine,tdengine-ws,hart]' pytest
          uv pip install --prerelease=allow 'pyiec61850>=1.5.2a1,<2'

      # taospy's native `taos` module dlopen()s libtaos at IMPORT time, so without
      # the C client the binding test skips and the TDengine sink's assumption
      # (`taos.connect` exists) is never checked against anything real. The client
      # is not on PyPI — it ships only as a vendor tarball.
      #
      # We extract the driver rather than run the vendor's install_client.sh: the
      # script wants root and does more than we need, and the only thing the test
      # requires is libtaos.so on the loader path. Pinned by version AND sha256 —
      # this is a third-party binary entering the build, so it may not float.
      #
      # Cached, bounded and non-fatal, because the first version of this step was a
      # reliability regression I put in myself: it worked once, then a later run
      # spent 300s hanging on `www.taosdata.com` and failed the whole build. Making
      # every build depend on a vendor CDN being reachable is the wrong trade for
      # one symbol check. So: cache it (the usual path never touches the network),
      # bound the fetch, and on a definitive failure warn LOUDLY and carry on — the
      # binding test then skips with its own honest reason. An announced degradation,
      # not a silent one.
      - name: Cache the TDengine client tarball
        uses: actions/cache@v4
        with:
          path: /tmp/td.tar.gz
          key: tdengine-client-3.3.5.0-b4f8fe35

      - name: Install the TDengine C client (libtaos)
        run: |
          set -uo pipefail
          ver=3.3.5.0
          sha=b4f8fe356d202022c9bc0c662c0a92db6c9463423eeb23cbbe5ef502f6c6d2be
          if ! echo "${sha}  /tmp/td.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            curl -sSL --connect-timeout 20 --max-time 240 --retry 2 --retry-delay 5 \
              -o /tmp/td.tar.gz \
              "https://www.taosdata.com/assets-download/3.0/TDengine-client-${ver}-Linux-x64.tar.gz" || true
          fi
          if ! echo "${sha}  /tmp/td.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            echo "::warning title=libtaos unavailable::Could not fetch the TDengine client from the vendor CDN. test_tdengine_taos_surface will SKIP — this build does not check the TDengine sink's binding against the real client."
            exit 0
          fi
          set -e
          tar xzf /tmp/td.tar.gz -C /tmp "TDengine-client-${ver}/driver/libtaos.so.${ver}"
          sudo install -m 0755 "/tmp/TDengine-client-${ver}/driver/libtaos.so.${ver}" /usr/lib/
          sudo ln -sf "/usr/lib/libtaos.so.${ver}" /usr/lib/libtaos.so.1
          sudo ln -sf /usr/lib/libtaos.so.1 /usr/lib/libtaos.so
          sudo ldconfig
          # libtaos opens a CLIENT-side log in /var/log/taos before it does
          # anything else, and a failure there does not surface as "cannot write
          # a log" — `taos_connect` returns `[0x000d]: Permission denied`, which
          # reads like a rejected password. The runner user cannot create that
          # directory, so create it here. (Reproduced locally by running the
          # client as a non-root user before believing the error message.)
          sudo mkdir -p /var/log/taos
          sudo chmod 1777 /var/log/taos

      # The two historian TSDBs had never been checked against a server — only
      # against their client libraries' symbol surface (rung 1). That is blind to
      # everything the round-trip found on 2026-08-02: an IoTDB wildcard select
      # whose fields do not line up with its declared columns under a WHERE clause
      # (the reader attributed one machine's value to another tag), and a TDengine
      # coverage query using MIN/MAX on a TIMESTAMP column, which taosd rejects
      # outright. Both ship as Docker images, so this is a container each.
      #
      # Started here rather than in the gate job because this lane is the one that
      # installs the `iotdb`/`tdengine` extras and the native libtaos client.
      - name: Start IoTDB, TDengine and a third-party OPC-UA server
        run: |
          docker run -d --rm --name iaiops-iotdb -p 6667:6667 apache/iotdb:1.3.2-standalone
          # Microsoft's opc-plc is built on the OPC Foundation .NET stack — an
          # implementation nobody here wrote, unlike the asyncua server every other
          # OPC-UA test uses. It is what showed that asyncua 1.x cannot open a
          # session on that stack at all (VERIFICATION-RECORD note 8), so this has
          # to keep running: the test is written to go RED when that changes.
          docker run -d --rm --name iaiops-opcplc -p 50000:50000 \
            mcr.microsoft.com/iotedge/opc-plc:2.12.28 \
            --pn=50000 --autoaccept --unsecuretransport
          # TAOS_FQDN/--hostname: a taosd dnode advertises its own FQDN, and the
          # native client reconnects to whatever it is told. Left at the default
          # that is the container id, which resolves inside the container network
          # and nowhere else — so a client on the runner would connect once and
          # then fail to find the node it was just talking to.
          # 6041 is taosAdapter: the REST and WebSocket transports both use it, and
          # neither needs the vendor libtaos the native client on 6030 does.
          docker run -d --rm --name iaiops-taos --hostname localhost \
            -e TAOS_FQDN=localhost -p 6030:6030 -p 6041:6041 tdengine/tdengine:3.3.5.0
          # An open port is not readiness for any of these: IoTDB accepts TCP while
          # the DataNode is still starting, taosd answers only once its dnode is up,
          # and opc-plc binds before it has built its address space. Wait for what
          # each one says about itself — and FAIL if it never says it. A silent
          # timeout here would leave the live tests skipping while the build stayed
          # green, which is the exact failure mode this lane exists to end.
          ready() {  # $1 container, $2 probe, $3 label
            for i in $(seq 1 60); do
              if eval "$2" >/dev/null 2>&1; then echo "$3 ready (attempt $i)"; return 0; fi
              sleep 2
            done
            echo "::error title=$3 not ready::$3 never became ready — its live tests would have SKIPPED and this build would have stayed green"
            docker logs "$1" 2>&1 | tail -30 || true
            return 1
          }
          # Each probe ends with a TCP connect FROM THE RUNNER, because that is
          # exactly what the tests' skipif guards do (socket.create_connection on
          # 127.0.0.1). Container logs and `docker exec` say nothing about the
          # published port: a container that printed its banner and then died, or
          # one whose port never published, would pass a log-only probe and then
          # let every live test skip on a green build — the hole this gate exists
          # to close. Ask the same question the test asks.
          ready iaiops-iotdb 'docker logs iaiops-iotdb 2>&1 | grep -q "DataNode is set up successfully" && (echo > /dev/tcp/127.0.0.1/6667)' IoTDB
          ready iaiops-taos 'docker exec iaiops-taos taos -s "SHOW DATABASES" && (echo > /dev/tcp/127.0.0.1/6030)' TDengine
          ready iaiops-opcplc 'docker logs iaiops-opcplc 2>&1 | grep -q "PLC simulation started" && (echo > /dev/tcp/127.0.0.1/50000)' opc-plc

      # Certificate TRUST needs a SECOND opc-plc — one WITHOUT --autoaccept, so it
      # actually enforces its trust store. The harness owns that container's whole
      # lifecycle (it also has to promote a certificate mid-test, which only works
      # from inside the container), so it runs as its own step rather than joining
      # the lane above.
      - name: OPC-UA certificate trust (strict third-party server)
        env:
          IAIOPS_REQUIRE_LIVE: "1"
        run: >-
          scripts/opcua_cert_harness.sh
          uv run --no-sync pytest tests/test_opcua_cert_trust_live.py -q -rs

      # --no-sync: keep the ad-hoc `uv pip install` env above; don't re-sync from
      # the lockfile (which has no energy/TSDB/HART extras).
      # IAIOPS_REQUIRE_LIVE=1 turns a skip into a failed run: every service this
      # lane needs was started and gated above, so a skip means a container, a
      # client library or an env var stopped doing what the record claims.
      # EXCEPT the TDengine binding test, whose libtaos fetch is deliberately
      # non-fatal (see the vendor-CDN step above) — that one is allowed to skip.
      - name: Integration contract tests (real library APIs)
        env:
          IAIOPS_REQUIRE_LIVE: "1"
        run: >-
          uv run --no-sync pytest -q -rs -m integration
          tests/test_binding_contracts.py tests/test_opcua_discovery.py
          tests/test_tsdb_live.py tests/test_opcua_thirdparty_live.py
