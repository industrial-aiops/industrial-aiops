# Margo Application Description for iaiops — built to the Margo specification v1.0.0-rc.3
# (Preview Release 3, tag v1.0.0-rc.3 = commit dc0bf84, 2026-09-15) and validated against its
# LinkML schema by scripts/margo_validate.sh (structural validity only — NOT a compliance claim).
#
# rc.3 changed the package model: an Application Package is an OCI artifact in an application
# registry (artifactType application/vnd.margo.app.v1+json, tag == metadata.version), and each
# component names its deployable by `repository: oci://…` + `revision`. CI
# (.github/workflows/publish-image.yml, job margo-oci) pushes both and cosign-signs them; the
# signed HTTPS tarball of earlier releases is still attached to each GitHub release as a mirror.
#
# WG feedback (app-package-definition-wg, 2026-07-13, ABB / P. Presson — Discourse t/43):
#   • Runtime shape — out of Margo's scope; socket transport recommended. This descriptor targets
#     the socket (streamable-http) transport (one container port), bearer-token authenticated
#     because Margo leaves workload-to-workload authentication to the application.
#   • Profiles — one parameterised application (the `profile` parameter), not N packages.
#   • Secrets — still no secret-typed parameter (margo/specification#145, open). The deploy config
#     carries only a REFERENCE; see `masterPassword` / `mcpToken` and ../../docs/MARGO-ALIGNMENT.md.
#
# 待核实: the OCI format of a compose component is not specified by Margo (left to supplier and
# WFM to agree); we publish it the way `docker compose publish` does. iaiops has NOT been run
# through the conformance test toolkit (margo/conformance_test_toolkit, unmerged as of
# 2026-10-15), so it is NOT Margo-compliant. See ../../docs/MARGO-ALIGNMENT.md.
apiVersion: v1
id: io-github-industrial-aiops-iaiops
metadata:
  name: Industrial-AIOps
  description: >-
    Vendor-neutral, read-first OT data tap across ~14 field protocols with a cross-protocol
    root-cause brain, exposed as governed MCP tools (audit / budget / risk-tier / undo + MOC
    gating on the few writes). Air-gap friendly.
  version: "0.28.0"
  catalog:
    application:
      tagline: Governed OT read tap + cross-protocol RCA, as MCP tools
      site: https://github.com/industrial-aiops/industrial-aiops
      tags: ["ot", "iiot", "diagnostics", "mcp", "read-only"]
    author:
      - name: wei
        email: zhouwei008@gmail.com
    organization:
      - name: Industrial-AIOps (independent)
        site: https://github.com/industrial-aiops

deploymentProfiles:
  - type: compose
    id: iaiops-compose
    description: >-
      Single hardened, non-root container (read-only rootfs; outbound-only to the operator-configured
      OT endpoints, with ONE bearer-token-authenticated, IP-allowlisted inbound port for the MCP
      tool interface — not an OT listener).
    components:
      - name: iaiops
        properties:
          # The deploy-ready compose (deploy/margo/package.compose.yaml), pushed by CI as an OCI
          # artifact and cosign-signed (key: deploy/margo/cosign.pub). Kept in sync with
          # pyproject.toml by tests/test_margo_package.py.
          repository: oci://ghcr.io/industrial-aiops/iaiops-compose
          revision: 0.28.0
          wait: true
          timeout: 5m00s
    deviceConstraints:
      capacityRequirements:
        cpu:
          cores: 0.5
          architectures: [amd64, arm64]
        memory: 512Mi
        storage: 1Gi
      eligibilityRules:
        - propertySelector:
            matchExpressions:
              - key: /interfaces
                operator: ContainsAll
                itemSelector:
                  matchExpressions:
                    - key: /type
                      operator: In
                      values: ["ethernet"]

parameters:
  profile:
    value: factory
    targets:
      - pointer: IAIOPS_MCP        # compose profile → environment variable
        components: [iaiops]
  transport:
    value: streamable-http         # socket transport (WG-recommended); or "stdio"
    targets:
      - pointer: IAIOPS_MCP_TRANSPORT
        components: [iaiops]
  mcpPort:
    value: "8000"                  # inbound MCP tool-interface port (socket transport only)
    targets:
      - pointer: IAIOPS_MCP_PORT
        components: [iaiops]
  allowlistIps:
    value: 127.0.0.1/32            # who may call the MCP port (CIDR list) — set to the orchestrator
    targets:
      - pointer: IAIOPS_ALLOWLIST_IPS
        components: [iaiops]
  masterPassword:
    # Secret parameter. The spec has no secret-typed flag yet (margo/specification#145), so this is
    # modeled as a plain parameter carrying a REFERENCE, not a value: leave it empty here and inject
    # the real value from the host/device secret facility at deploy time. iaiops itself resolves
    # every OT/IT credential from its on-box encrypted store BY NAME — secret values never travel in
    # this descriptor or the deployment spec. See ../../docs/MARGO-ALIGNMENT.md appendix B.
    value: ""
    targets:
      - pointer: IAIOPS_MASTER_PASSWORD
        components: [iaiops]
  mcpToken:
    # Secret parameter, same REFERENCE model as masterPassword: inject at deploy time. The bearer
    # token every MCP request must carry; the socket transport refuses to start without it.
    value: ""
    targets:
      - pointer: IAIOPS_MCP_TOKEN
        components: [iaiops]

configuration:
  sections:
    - name: Edition & Access
      settings:
        - parameter: profile
          name: Edition profile
          description: Which field-protocol connectors load.
          immutable: false
          schema: profileSchema
        - parameter: transport
          name: MCP transport
          description: >-
            How the orchestrator/agent reaches the tools. "streamable-http" is a socket on mcpPort
            (WG-recommended, 2026-07-13); "stdio" pipes over the container's stdio.
          immutable: false
          schema: transportSchema
        - parameter: mcpPort
          name: MCP port
          description: Inbound port for the socket transport (ignored under stdio).
          immutable: false
          schema: portSchema
        - parameter: allowlistIps
          name: MCP client IP allowlist
          description: >-
            CIDR list allowed to call the MCP port (403 otherwise) — defense-in-depth for the
            socket transport. Set to the orchestrator/gateway address(es).
          immutable: false
          schema: allowlistSchema
        - parameter: masterPassword
          name: Secret-store master password
          description: >-
            Unlocks the encrypted on-box secret store. 待核实: the spec has no secret-typed
            parameter yet — tracked at margo/specification#145. Carried as a reference (inject the
            value from the device secret facility at deploy time), never stored in this descriptor.
          immutable: false
          schema: passwordSchema
        - parameter: mcpToken
          name: MCP bearer token
          description: >-
            Every MCP request must carry it as 'Authorization: Bearer <token>'; the socket transport
            refuses to start without one (at least 32 printable ASCII characters, e.g. openssl
            rand -base64 48). Same reference model as the master password — never stored in this
            descriptor.
          immutable: false
          schema: tokenSchema
  schema:
    # SelectValidationSchema — the five edition profiles.
    - name: profileSchema
      dataType: string
      options: [fab, factory, process, building, water]
      multiselect: false
      allowEmpty: false
    # SelectValidationSchema — the MCP transport.
    - name: transportSchema
      dataType: string
      options: [streamable-http, sse, stdio]
      multiselect: false
      allowEmpty: false
    # TextValidationSchema — TCP port.
    - name: portSchema
      dataType: string
      minLength: 1
      maxLength: 5
      allowEmpty: false
    # TextValidationSchema — CIDR allowlist.
    - name: allowlistSchema
      dataType: string
      allowEmpty: true
    # TextValidationSchema.
    - name: passwordSchema
      dataType: string
      minLength: 8
      allowEmpty: false
    # Matches the server's own rule (mcp_server/http_auth.py MIN_TOKEN_LENGTH): a WFM must not
    # accept a token the application then refuses at start.
    - name: tokenSchema
      dataType: string
      minLength: 32
      allowEmpty: false
