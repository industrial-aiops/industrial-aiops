# Library profile derived from the Modbus template `huawei_sun2000_inverter`.
# 待核实 — public register map; addresses/gains vary by SUN2000 model and firmware; confirm against the Huawei Modbus interface definition.
# Copy it (`iaiops sensor show <id> --out <file>`), check one reading against
# the device's own display, then bind it as `sensor_profile:` in config.yaml.
id: pv-inverter-huawei-sun2000-inverter
protocol: modbus
source: community
verified: 待核实
description: 'Huawei SUN2000 inverter core telemetry (FC03, int32/uint16, ABCD). Not
  included (status codes, not measurements): device_status.'
derived_from: modbus-template:huawei_sun2000_inverter
channels:
- name: input_power
  layout:
    table: holding
    address: 32064
    type: int32
    order: ABCD
  unit: W
  signal: level
- name: active_power
  layout:
    table: holding
    address: 32080
    type: int32
    order: ABCD
  unit: W
  signal: level
- name: grid_frequency
  layout:
    table: holding
    address: 32085
    type: uint16
    order: AB
  scale: 0.01
  unit: Hz
  signal: level
- name: efficiency
  layout:
    table: holding
    address: 32086
    type: uint16
    order: AB
  scale: 0.01
  unit: '%'
  signal: level
